<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Report - BugSense Professional</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { slate: { 850: '#151e2e' } }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-200 font-sans antialiased min-h-screen">

    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
                    <i data-feather="file-text" class="w-4 h-4"></i>
                </div>
                <span class="font-bold text-lg dark:text-white">Analysis Report</span>
            </div>
            <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-2 transition-colors">
                <i data-feather="arrow-left" class="w-4 h-4"></i> Return to Scanner
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 pb-20">
        
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10 mt-6">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-2">Security & Logic Assessment</h1>
                <div class="flex items-center gap-3 text-sm text-slate-500">
                    <span id="timestamp">Generated just now</span>
                    <span>•</span>
                    <span class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded font-mono text-xs uppercase" id="engine-ver">Engine v4.0</span>
                </div>
            </div>
            
            <div id="risk-badge-container" class="animate-in fade-in zoom-in duration-500">
                </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden group">
                <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><i data-feather="code" class="w-16 h-16"></i></div>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Language</p>
                <h3 class="text-2xl font-bold capitalize" id="lang-display">--</h3>
            </div>
            
            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden group">
                <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><i data-feather="layers" class="w-16 h-16"></i></div>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Lines Scanned</p>
                <h3 class="text-2xl font-bold font-mono" id="loc-display">--</h3>
            </div>

            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden group">
                <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><i data-feather="git-branch" class="w-16 h-16"></i></div>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Cyclomatic Complexity</p>
                <h3 class="text-2xl font-bold font-mono" id="complexity-display">--</h3>
            </div>

            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm relative overflow-hidden group">
                <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><i data-feather="alert-triangle" class="w-16 h-16 text-red-500"></i></div>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Critical Flaws</p>
                <h3 class="text-2xl font-bold text-red-500" id="critical-count">--</h3>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-lg overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex items-center justify-between">
                <h2 class="font-bold text-lg flex items-center gap-2">
                    <i data-feather="activity" class="text-indigo-500 w-5 h-5"></i> 
                    Detailed Findings
                </h2>
                <button onclick="window.print()" class="text-xs font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-1">
                    <i data-feather="printer" class="w-3 h-3"></i> Print PDF
                </button>
            </div>

            <div id="findings-container" class="divide-y divide-slate-100 dark:divide-slate-800">
                <div class="p-12 text-center">
                    <div class="animate-pulse flex flex-col items-center">
                        <div class="h-4 w-48 bg-slate-200 dark:bg-slate-800 rounded mb-3"></div>
                        <div class="h-3 w-32 bg-slate-200 dark:bg-slate-800 rounded"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-12 text-center border-t border-slate-200 dark:border-slate-800 pt-8">
            <p class="text-slate-400 text-sm">BugSense Professional Edition • Hackathon Build 2026</p>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Retrieve Data from Landing Page
            const dataString = localStorage.getItem('bugSenseResults');
            
            // Redirect if no data found (e.g., user opened report.html directly)
            if(!dataString) {
                window.location.href = 'index.html';
                return;
            }

            const data = JSON.parse(dataString);

            // 2. Populate Metrics
            document.getElementById('lang-display').textContent = data.language;
            document.getElementById('loc-display').textContent = data.loc;
            document.getElementById('complexity-display').textContent = data.complexity;
            
            // 3. Risk Badge Logic
            const score = data.risk_score;
            const badgeContainer = document.getElementById('risk-badge-container');
            
            let badgeColor, badgeText, badgeIcon;
            
            if(score < 30) {
                badgeColor = "bg-emerald-100 text-emerald-700 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800";
                badgeText = "PASSED / SAFE";
                badgeIcon = "check-circle";
            } else if (score < 70) {
                badgeColor = "bg-orange-100 text-orange-700 border-orange-200 dark:bg-orange-900/30 dark:text-orange-400 dark:border-orange-800";
                badgeText = "WARNING / RISK";
                badgeIcon = "alert-circle";
            } else {
                badgeColor = "bg-red-100 text-red-700 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800";
                badgeText = "CRITICAL FAIL";
                badgeIcon = "x-octagon";
            }

            badgeContainer.innerHTML = `
                <div class="flex flex-col items-end">
                    <div class="px-5 py-2 rounded-xl font-bold text-lg border ${badgeColor} flex items-center gap-2 shadow-sm">
                        <i data-feather="${badgeIcon}" class="w-5 h-5"></i>
                        ${badgeText}
                    </div>
                    <div class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider">Risk Score: ${score}%</div>
                </div>
            `;

            // 4. Render Issues List
            const container = document.getElementById('findings-container');
            container.innerHTML = ""; // Clear loader
            
            let criticals = 0;

            if (data.issues.length === 0) {
                container.innerHTML = `
                    <div class="p-16 text-center">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-feather="check" class="w-8 h-8"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">No Vulnerabilities Found</h3>
                        <p class="text-slate-500">Your code passed all static analysis checks. Great job!</p>
                    </div>
                `;
            } else {
                data.issues.forEach(issue => {
                    if(issue.severity === 'Critical') criticals++;
                    
                    // Style based on severity
                    let severityColor;
                    if(issue.severity === 'Critical') severityColor = 'text-red-700 bg-red-50 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800';
                    else if(issue.severity === 'High') severityColor = 'text-orange-700 bg-orange-50 border-orange-200 dark:bg-orange-900/30 dark:text-orange-400 dark:border-orange-800';
                    else severityColor = 'text-blue-700 bg-blue-50 border-blue-200 dark:bg-blue-900/30 dark:text-blue-400 dark:border-blue-800';

                    const html = `
                        <div class="p-6 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                            <div class="flex items-start gap-5">
                                <div class="mt-1 flex-shrink-0">
                                    <span class="px-3 py-1 rounded-md text-xs font-bold border uppercase tracking-wider ${severityColor}">
                                        ${issue.severity}
                                    </span>
                                </div>
                                
                                <div class="flex-1">
                                    <div class="flex items-center justify-between mb-2">
                                        <h3 class="font-bold text-slate-900 dark:text-white text-lg group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                                            ${issue.title}
                                        </h3>
                                        <div class="flex items-center gap-2 text-slate-400 font-mono text-sm">
                                            <i data-feather="code" class="w-3 h-3"></i>
                                            <span>Line ${issue.line}</span>
                                        </div>
                                    </div>
                                    <p class="text-slate-600 dark:text-slate-400 leading-relaxed">
                                        ${issue.description}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });
            }

            document.getElementById('critical-count').textContent = criticals;

            // Re-init icons for dynamic content
            feather.replace();
            
            // Set timestamp
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        });
    </script>
</body>
</html>
